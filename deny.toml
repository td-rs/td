# cargo-deny configuration (CI `deny` job, S02).
# advisories: vulnerabilities are denied by default; also fail on yanked deps.
# bans: duplicate crate versions only warn for now — tighten once real deps land.
# licenses: allow-list covers MIT (ourselves) plus the permissive set used by
# the general-purpose crates the plan allows (tokio, serde, RustCrypto, rustls).
# sources: only crates.io; no git dependencies.

[advisories]
yanked = "deny"

# RUSTSEC-2023-0071 (Marvin Attack, rsa < 0.9): no upstream patch exists.
# The repo never decrypts with this key path — the rsa crate rides the
# M.44 SecureManager plane for PUBLIC-KEY encryption only (the Telegram
# SRP/password flows), which the advisory does not cover. Signed off by
# the owner decision record 2026-09-23 (RUST_REWRITE_REMAINING.md,
# owner items); revisit when rsa ships the constant-time rework.
ignore = ["RUSTSEC-2023-0071"]

[bans]
multiple-versions = "warn"

[licenses]
allow = [
  "BSL-1.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # webpki-roots: the pinned CA bundle is data under the permissive
  # Community Data License Agreement, not code.
  "CDLA-Permissive-2.0",
]

# Our own tdtl crate is a faithful port of td's tl-parser.c, which is
# GPL-2.0-or-later (tgl/tlc derivative) — build-time tooling only, never
# linked into shipped artifacts. Dependencies must stay permissive.
[[licenses.exceptions]]
crate = "tdtl"
allow = ["GPL-2.0-or-later"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
