# Bench crate — ports of the C++ `benchmark/` targets (S37 first: bench_actor).
# Own manifest, excluded from the workspace (built and run separately, like
# `conformance/`).
[package]
name = "bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
tdactor = { path = "../crates/tdactor" }
tdutils = { path = "../crates/tdutils" }
tdmtproto = { path = "../crates/tdmtproto" }
tddb = { path = "../crates/tddb" }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
crc32fast = "1"
itoa = "1"
base64 = "0.22"

[[bin]]
name = "bench_actor"
path = "src/bin/bench_actor.rs"

[[bin]]
name = "bench_crypto"
path = "src/bin/bench_crypto.rs"

[[bin]]
name = "bench_handshake"
path = "src/bin/bench_handshake.rs"

[[bin]]
name = "bench_db"
path = "src/bin/bench_db.rs"

[[bin]]
name = "bench_queue"
path = "src/bin/bench_queue.rs"

[[bin]]
name = "bench_http"
path = "src/bin/bench_http.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[profile.release]
# Thin LTO + one codegen unit: the C++ bench compiles the scheduler's
# header-inline hot path (EventGuard, add_to_mailbox, ActorInfo methods)
# directly into the bench translation unit — full inlining without any
# LTO. The Rust equivalent of "compile the scheduler into the bench
# binary" is cross-crate inlining, i.e. LTO; without it every actor hop
# pays real cross-crate calls (the S96 measurement: the ring ran 16.4M vs
# ~50M ops/s C++). `codegen-units = 1` stabilizes the thin-LTO codegen:
# with the default 16 units the ECB per-block loop pessimized 2.2x (74K
# vs 162K ops/s, an inlining artifact — the same code at parity without
# LTO); one unit restores it to 170K, better than the no-LTO baseline.
# Keep the default opt-level 3, like the C++ Release build.
lto = "thin"
codegen-units = 1
