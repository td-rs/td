# conformance: differential-testing tooling against the C++ td oracle (plan S04+).
# Standalone crate, excluded from the main workspace on purpose (see root Cargo.toml).

[package]
name = "td-conformance"
version = "0.1.0"
edition = "2024"
license = "BSL-1.0"
publish = false
description = "Golden vectors and differential harness for the td Rust rewrite"

[dependencies]
rsa = "0.9"
sha2 = "0.10"
tdclient = { path = "../crates/tdclient" }
tdjson = { path = "../crates/tdjson" }
tl-codegen = { path = "../crates/tl-codegen" }
tdtl = { path = "../crates/tdtl" }
tdmtproto = { path = "../crates/tdmtproto" }
tdnet = { path = "../crates/tdnet" }
tdutils = { path = "../crates/tdutils" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[[bin]]
name = "extract-test-data"
path = "src/main.rs"

[[bin]]
name = "tdjson-oracle"
path = "src/bin/tdjson_oracle.rs"

[[bin]]
name = "td-api-parity"
path = "src/bin/td_api_parity.rs"

[[bin]]
name = "mock_dc"
path = "src/bin/mock_dc.rs"

[[bin]]
name = "handshake_client"
path = "src/bin/handshake_client.rs"

[[bin]]
name = "auth_data_rw"
path = "src/bin/auth_data_rw.rs"
