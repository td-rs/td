<!doctype html>
<html>
<head><meta charset="utf-8"><title>td-rs tdweb IDB harness</title></head>
<body style="font-family: monospace; white-space: pre-wrap; padding: 1em">
<h3>td-rs tdweb IDB harness — durable /tdlib_data (IDBFS)</h3>
<div id="log">starting…</div>
<script>
  const log = document.getElementById('log');
  const line = s => { log.textContent += '\n' + s; };
  line('crossOriginIsolated(main): ' + self.crossOriginIsolated);
  const params = new URLSearchParams(self.location.search);
  const w = new Worker('/tdweb-idb-worker.js' + self.location.search, { name: 'tdweb-idb' });
  w.onmessage = e => {
    const m = e.data;
    line(JSON.stringify(m).slice(0, 300));
    if (m.t === 'TDWEB_IDB_PASS') line('=== TDWEB_IDB_PASS ===');
    if (m.t === 'TDWEB_IDB_FAIL' || m.t === 'DEEP_ERROR') line('=== TDWEB_IDB_FAIL ===');
  };
  w.onerror = e => line('WORKER_ERROR: ' + e.message);
</script>
</body>
</html>
