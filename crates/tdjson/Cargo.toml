[package]
name = "tdjson"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The drop-in `libtdjson` replacement: a cdylib for the C ABI plus an rlib
# so the workspace can link the symbols in tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
tdclient = { path = "../tdclient" }
tdutils = { path = "../tdutils" }
