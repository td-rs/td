[package]
name = "tdmtproto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Compiles the generated sample synthesizers outside cfg(test) for the S15
# replay oracle bins (conformance/tl_replay_oracle).
conformance-samples = []

[dependencies]
base64 = "0.22"
tdnet = { path = "../tdnet" }
tdutils = { path = "../tdutils" }

# tokio's `net` feature (mio) has no wasm32-unknown-emscripten backend; the
# socket modules are cfg'd off-wasm and wasm sees the shims in src/wasm/.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["io-util", "macros", "time"] }

[build-dependencies]
tl-codegen = { path = "../tl-codegen" }
