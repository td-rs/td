[package]
name = "tddb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "1"
libc = "0.2"
# vendored OpenSSL: SQLCipher's codec needs it, and the workspace must build
# without system-wide OpenSSL (NixOS, CI).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
tdutils = { path = "../tdutils" }
tracing = "0.1"
