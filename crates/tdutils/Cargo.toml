[package]
name = "tdutils"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
crc32fast = "1"
crossbeam-channel = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
libz-sys = "1"
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
num-bigint = "0.4"
num-integer = "0.1"
num-prime = "0.4"
num-traits = "0.2"
crypto-bigint = "0.7"
pbkdf2 = "0.12"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand_core = "0.6"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing = "0.1"
x25519-dalek = "2"

# The AES-CTR bulk-path bridge (S96 §1.1): native builds run the streaming
# CTR through the vendored OpenSSL EVP — the exact assembly the C++
# `td::AesCtrState` uses. The library is already linked for sqlcipher
# (`tddb`'s `bundled-sqlcipher-vendored-openssl`), so this adds no new C
# build. emscripten links no OpenSSL and keeps the RustCrypto path
# (see `crypto.rs`).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
parking_lot = "0.12"
