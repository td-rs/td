[package]
name = "tdutils"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
crc32fast = "1"
ctor = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
num-bigint = "0.4"
num-integer = "0.1"
num-prime = "0.4"
num-traits = "0.2"
pbkdf2 = "0.12"
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand_core = "0.6"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tracing = "0.1"
x25519-dalek = "2"
