[package]
name = "tdclient"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2.189"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
tdactor = { path = "../tdactor" }
tddb = { path = "../tddb" }
tdnet = { path = "../tdnet" }
tracing = "0.1"
tdmtproto = { path = "../tdmtproto" }
tdutils = { path = "../tdutils" }

# tokio's `net` feature (mio) has no wasm32-unknown-emscripten backend; the
# socket paths (session_multi_proxy::open_connection, the config-recoverer
# direct-DC leg) are cfg'd off-wasm behind fail-fast twins.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
