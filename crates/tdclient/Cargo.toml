[package]
name = "tdclient"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2.189"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
tdactor = { path = "../tdactor" }
tddb = { path = "../tddb" }
tdnet = { path = "../tdnet" }
tracing = "0.1"
tdmtproto = { path = "../tdmtproto" }
tdutils = { path = "../tdutils" }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tl-codegen = { path = "../tl-codegen" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
