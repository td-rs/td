[package]
name = "tdclient"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
tdactor = { path = "../tdactor" }
tddb = { path = "../tddb" }
tracing = "0.1"
tdmtproto = { path = "../tdmtproto" }
tdutils = { path = "../tdutils" }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros"] }

[build-dependencies]
tl-codegen = { path = "../tl-codegen" }

[dev-dependencies]
serde_json = "1"
