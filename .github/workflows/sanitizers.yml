# Memory / concurrency error detection. Expensive checks kept off PRs:
#   - ASan + LeakSanitizer over the whole workspace
#   - TSan with instrumented std (build-std; without it TSan misses
#     synchronization inside std and reports false positives)
#   - Miri on tdutils (the only crate with unsafe-heavy code today)
#
# The nightly is pinned by date for reproducibility — bump it deliberately.
# No rust-cache: every run is a clean, from-scratch build.
name: Sanitizers

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 3 * * *" # nightly, after Main CI
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Required: RUSTUP_TOOLCHAIN is the only override that beats the repo's
  # rust-toolchain.toml (1.95). Without it rustup would route the sanitizer
  # flags to the pinned stable toolchain and fail.
  RUSTUP_TOOLCHAIN: nightly-2026-09-01

jobs:
  asan:
    runs-on: ubuntu-24.04
    # The public-repo standard runner is 4 vCPU / 16 GB RAM / 14 GB disk.
    # A from-scratch full-workspace debug ASan build with debuginfo starves
    # it (runner shutdown signals mid-compile) and links too slowly to fit
    # 45 minutes; debuginfo=0 keeps reports symbolized at function level
    # via the ELF symtab — line numbers are recoverable by reproducing
    # locally with full debuginfo.
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Zsanitizer=address -Cdebug-assertions -Coverflow-checks -Cdebuginfo=0
      # detect_leaks=1: LeakSanitizer ships inside ASan on Linux.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
      # --lib/--bins/--tests: sanitizer runtimes cannot be linked into
      # rustdoc-built doctest binaries (rust-lang/cargo#9025) — including
      # doctests fails the link step with undefined __asan_* symbols.
      - run: cargo test --workspace --locked --target x86_64-unknown-linux-gnu --lib --bins --tests

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # debuginfo=0 for the same 16 GB / 14 GB hosted-runner budget as the
      # asan job: with full debuginfo the instrumented build-std compile
      # starves the runner and the step dies to a shutdown signal (exit
      # 143) a few minutes in.
      RUSTFLAGS: -Zsanitizer=thread -Cdebuginfo=0
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
          components: rust-src
      # Mostly green today (little concurrency code yet); becomes the real
      # gate for the tdactor port (S07+). No doctests: same cargo#9025 link
      # limitation as the asan job.
      - run: cargo test -Zbuild-std=std --workspace --locked --target x86_64-unknown-linux-gnu --lib --bins --tests

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The harness tests write temp files (regression tester); grant the
      # real host filesystem instead of Miri's isolated one.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
          components: miri
      # tdutils only for now — widen as crates land. The vendored-OpenSSL
      # and libz FFI cannot run under the interpreter: tdutils routes Miri
      # onto its pure-Rust fallback arms (same cfg as emscripten), and the
      # zlib byte-identity tests ignore under Miri (gzip.rs says why).
      - run: cargo miri test -p tdutils --locked
