# Memory / concurrency error detection. Expensive checks kept off PRs:
#   - ASan + LeakSanitizer over the whole workspace
#   - TSan with instrumented std (build-std; without it TSan misses
#     synchronization inside std and reports false positives)
#   - Miri on tdutils (the only crate with unsafe-heavy code today)
#
# The nightly is pinned by date for reproducibility — bump it deliberately.
# No rust-cache: every run is a clean, from-scratch build.
name: Sanitizers

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 3 * * *" # nightly, after Main CI
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Required: RUSTUP_TOOLCHAIN is the only override that beats the repo's
  # rust-toolchain.toml (1.95). Without it rustup would route the sanitizer
  # flags to the pinned stable toolchain and fail.
  RUSTUP_TOOLCHAIN: nightly-2026-09-01

jobs:
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=address -Cdebug-assertions -Coverflow-checks
      # detect_leaks=1: LeakSanitizer ships inside ASan on Linux.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
      # --lib/--bins/--tests: sanitizer runtimes cannot be linked into
      # rustdoc-built doctest binaries (rust-lang/cargo#9025) — including
      # doctests fails the link step with undefined __asan_* symbols.
      - run: cargo test --workspace --locked --target x86_64-unknown-linux-gnu --lib --bins --tests

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Zsanitizer=thread
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
          components: rust-src
      # Mostly green today (little concurrency code yet); becomes the real
      # gate for the tdactor port (S07+). No doctests: same cargo#9025 link
      # limitation as the asan job.
      - run: cargo test -Zbuild-std=std --workspace --locked --target x86_64-unknown-linux-gnu --lib --bins --tests

  miri:
    # Advisory for now (continue-on-error): the S05 test harness registers
    # tests through the `ctor` crate, whose section-function ABI hack modern
    # Miri reports as UB at tdutils/src/tests.rs:552 (fn declared -> usize,
    # invoked with a () return place). Known ctor-vs-Miri ecosystem issue;
    # everything after ctor registration is still checked. Flip to gating
    # when the harness changes registration or ctor ships a Miri-clean path.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01
          components: miri
      # tdutils only for now — widen as crates land. If fs-touching tests
      # later trip Miri's isolation, adjust via MIRIFLAGS rather than dropping
      # the job.
      - run: cargo miri test -p tdutils --locked
