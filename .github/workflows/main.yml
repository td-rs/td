# Main-branch validation: everything PR CI covers (reused via workflow_call)
# plus the checks too slow or environment-heavy for every PR:
#   - platform matrix (Linux x64/arm64, macOS arm64 + Intel cross-check, Windows x64)
#   - current-stable compatibility (default elsewhere is the pinned 1.95)
#   - wasm advisory check on the supported target, wasm32-unknown-emscripten
#     (S82; emsdk + the emcc C toolchain env)
#   - bounded stress soak of the release test suite
#   - conformance verification against the C++ td oracle (pinned to the schemes commit, S03)
#
# Jobs in this file never use Swatinem/rust-cache: every run is a clean build
# by construction, so caching can never hide a from-scratch build problem.
# (PR CI in ci.yml is the cached fast path.)
#
# Toolchain pins (update deliberately, both here and in rust-toolchain.toml):
#   - default jobs: 1.95   (= clippy.toml MSRV)
#   - stable job:   stable (early-warning for future Rust releases)
name: Main CI

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *" # nightly, UTC
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # RUSTUP_TOOLCHAIN beats rust-toolchain.toml; jobs needing a different
  # toolchain override this at job level.
  RUSTUP_TOOLCHAIN: "1.95"

jobs:
  core:
    # The full PR suite (fmt/clippy/test/docs/conformance/deny), reused from
    # ci.yml so master and PR validation run identical commands.
    uses: ./.github/workflows/ci.yml

  stable:
    # Job-level override of the workflow-level RUSTUP_TOOLCHAIN pin — without
    # it rust-toolchain.toml/default would win and this would silently re-test
    # the pinned toolchain instead of current stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked

  matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted macOS runners are arm64-only now (macos-13 retired,
        # macos-14 sunsets Nov 2026); Intel macOS is covered by the
        # x86_64-apple-darwin cross-check step on the macos-15 leg.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Test (debug)
        run: cargo test --workspace --locked
      - name: Build all targets (release)
        run: cargo build --workspace --all-targets --release --locked
      - name: Cross-check x86_64-apple-darwin
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --locked --target x86_64-apple-darwin

  wasm:
    # Advisory (continue-on-error): `cargo check --lib` on the supported
    # wasm target — wasm32-unknown-emscripten (S82, packaging/wasm). This
    # is the lane that catches unix-only accidental dependencies early:
    # wasm32-unknown-unknown is NOT a target (no OS for the tddb/sqlcipher
    # C stack). The S82 recipe's CC/CXX/AR/RANLIB env is REQUIRED — cc-rs
    # silently falls back to the host gcc otherwise (packaging/wasm
    # findings), and the vendored libsqlite3-sys fork carries the emcc
    # fini_array fix. --lib only: the dev bins (dc_probe etc.) are
    # native-only tools. Still advisory until it has proven itself green;
    # flip to gating when it has.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-emscripten
      - name: Install emsdk (pinned to the version the S82 work verified)
        run: |
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.9
          /tmp/emsdk/emsdk activate 6.0.9
          echo /tmp/emsdk/upstream/emscripten >> "$GITHUB_PATH"
      - run: cargo check --workspace --lib --locked --target wasm32-unknown-emscripten
        env:
          CC: emcc
          CXX: em++
          AR: emar
          RANLIB: emranlib

  stress:
    # Bounded soak: keep re-running the release test suite for 10 minutes to
    # exercise global state, ctor registration and destructors repeatedly.
    # Grows into the harness `--stress` flag (S05 port) as stateful tests land.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - run: cargo test --workspace --locked --release --no-run
      - name: Soak (10 minutes)
        shell: bash
        run: |
          set +e
          passes=0
          end=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$end" ]; do
            if ! cargo test --workspace --locked --release --quiet; then set -e; exit 1; fi
            passes=$((passes + 1))
            echo "== stress pass $passes =="
          done
          set -e
          echo "soak window elapsed after $passes clean passes"

  conformance-verify:
    # Byte-verifies conformance/vectors against the C++ oracle (S04), the
    # tdtl lexer token stream against td's own tl-parser (S06), the tdtl
    # scheme program dump — types/constructors/functions with their ids —
    # against the same tl-parser (S07), the tdtl .tlo serialization —
    # incl. the combinator argument trees — against td's write_types (S08),
    # the tl-codegen telegram_api binary store against td's generated
    # C++ TlStorerUnsafe (S10), the td_api JSON converter output (S12), and
    # the replay gate: every constructor sample of all four wire schemes
    # fetched and re-stored by td's generated code (S15). The td checkout
    # is pinned to the same commit the TL schemes were imported from (S03).
    # S68/S73/S74 additionally build the real libtdjson (cmake) — that is
    # the long pole of the job's budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tdlib/td
          # Full SHA required: actions/checkout cannot fetch abbreviated SHAs.
          ref: 23383aef218a3123f02b744bfa91bde21056a814
          path: td-cpp
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: Build the C++ tdjson client (S68/S73 oracle)
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli libssl-dev zlib1g-dev cmake
          cmake -S td-cpp -B td-cpp/TD_BUILD -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF -DTD_ENABLE_LTO=OFF
          cmake --build td-cpp/TD_BUILD -j"$(nproc)" --target tdjson
      - name: Verify golden vectors vs C++ dump oracle (S04)
        run: conformance/cpp_dump/verify.sh "$GITHUB_WORKSPACE/td-cpp"
      - name: Verify tdtl lexer vs tl-parser oracle (S06)
        run: |
          if [ -x conformance/tl_oracle/verify.sh ]; then
            conformance/tl_oracle/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_oracle/verify.sh not committed yet (S06 in progress)"
          fi
      - name: Verify tdtl scheme program vs tl-parser oracle (S07)
        run: |
          if [ -x conformance/tl_oracle/verify_scheme.sh ]; then
            conformance/tl_oracle/verify_scheme.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_oracle/verify_scheme.sh not committed yet (S07 in progress)"
          fi
      - name: Verify tdtl .tlo serialization vs tl-parser oracle (S08)
        run: |
          if [ -x conformance/tl_oracle/verify_tlo.sh ]; then
            conformance/tl_oracle/verify_tlo.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_oracle/verify_tlo.sh not committed yet (S08 in progress)"
          fi
      - name: Verify tl-codegen binary store vs td generated C++ (S10)
        run: |
          if [ -x conformance/tl_store_oracle/verify.sh ]; then
            conformance/tl_store_oracle/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_store_oracle/verify.sh not committed yet (S10 in progress)"
          fi
      - name: Verify td_api JSON vs td generated converter (S12)
        run: |
          if [ -x conformance/tl_json_oracle/verify.sh ]; then
            conformance/tl_json_oracle/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_json_oracle/verify.sh not committed yet (S12 in progress)"
          fi
      - name: Replay differential codegen gate over all wire schemes (S15)
        run: |
          if [ -x conformance/tl_replay_oracle/verify.sh ]; then
            conformance/tl_replay_oracle/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tl_replay_oracle/verify.sh not committed yet (S15 in progress)"
          fi
      - name: Verify the C ABI responses vs the real C++ td_json_client (S68)
        run: |
          if [ -x conformance/tdjson_oracle/verify.sh ]; then
            conformance/tdjson_oracle/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/tdjson_oracle/verify.sh not committed yet (S68 in progress)"
          fi
      - name: Replay the recorder corpus through the Rust client (S73/S74)
        run: |
          if [ -x conformance/recorder/verify.sh ]; then
            conformance/recorder/verify.sh "$GITHUB_WORKSPACE/td-cpp"
          else
            echo "skipped: conformance/recorder/verify.sh not committed yet (S73 in progress)"
          fi

  recorder-live-corpus:
    # S76's nightly walking-skeleton gate: records a live test-DC session
    # with the C++ client (bot-token login, getMe, the receive of a phone
    # message and the reply send) and gates the Rust replayer on the same
    # corpus — diffed modulo the documented nondeterminism. Requires the
    # TD_BOT_TOKEN / TD_BOT_USERNAME / TD_API_HASH / TD_PEER_STATE secrets
    # (a test-DC bot created once with the bot_maker tool — tokens are
    # reusable, so no operator code provisioning is needed — and the S66
    # phone-account persisted state, base64); the job stays skipped until
    # they are configured so a missing secret cannot fail the workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: vars.TD_LIVE_CORPUS_ENABLED == 'true'
    steps:
      - id: creds
        # `secrets` is not an allowed context in job-level `if:`; gate the
        # heavy steps on this output instead (actionlint finding).
        env:
          TD_BOT_TOKEN: ${{ secrets.TD_BOT_TOKEN }}
          TD_BOT_USERNAME: ${{ secrets.TD_BOT_USERNAME }}
          TD_API_HASH: ${{ secrets.TD_API_HASH }}
          TD_PEER_STATE: ${{ secrets.TD_PEER_STATE }}
        run: |
          if [ -n "$TD_BOT_TOKEN" ] && [ -n "$TD_BOT_USERNAME" ] && [ -n "$TD_API_HASH" ] && [ -n "$TD_PEER_STATE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "skipped: TD_BOT_TOKEN/TD_BOT_USERNAME/TD_API_HASH/TD_PEER_STATE secrets not configured"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          repository: tdlib/td
          ref: 23383aef218a3123f02b744bfa91bde21056a814
          path: td-cpp
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ok == 'true'
        with:
          toolchain: "1.95"
      - name: Build the C++ tdjson client
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli libssl-dev zlib1g-dev cmake
          cmake -S td-cpp -B td-cpp/TD_BUILD -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF -DTD_ENABLE_LTO=OFF
          cmake --build td-cpp/TD_BUILD -j"$(nproc)" --target tdjson
      - name: Record a live test-DC session and gate the replayer (S76)
        if: steps.creds.outputs.ok == 'true'
        env:
          TD_BOT_TOKEN: ${{ secrets.TD_BOT_TOKEN }}
          TD_BOT_USERNAME: ${{ secrets.TD_BOT_USERNAME }}
          TD_API_HASH: ${{ secrets.TD_API_HASH }}
          # The secret holds the base64 state; verify_s76.sh/bot_maker take
          # the DECODED FILE PATH in TD_PEER_STATE (default /tmp/s66_state.bin).
          TD_PEER_STATE_B64: ${{ secrets.TD_PEER_STATE }}
          TD_PEER_STATE: /tmp/s66_state.bin
        run: |
          printf '%s' "$TD_PEER_STATE_B64" | base64 -d > "$TD_PEER_STATE"
          conformance/recorder/verify_s76.sh "$GITHUB_WORKSPACE/td-cpp"


  fuzz-smoke:
    # Bounded fuzz smoke of the parsing-heavy components (S78): each target
    # runs 60 s with coverage instrumentation via cargo-fuzz on nightly.
    # The S78 release gate is a one-week clean run per target; this job only
    # catches regressions quickly. Targets live in fuzz/fuzz_targets (the
    # crate is excluded from the workspace and builds standalone).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke (60 s per target)
        # cargo-fuzz resolves fuzz/Cargo.toml relative to the cwd, so it
        # must run from the repo root, not from inside fuzz/.
        run: |
          for target in td_api_json json_value binlog_event mtproto_packet tl_scheme_text transport_frame app_config simple_config message_input; do
            cargo fuzz run "$target" -- -max_total_time=60
          done
