# Fast PR validation: fmt + clippy -D warnings + test + docs + conformance build
# + cargo-deny. One job per check so failures are isolated.
# Also reusable (workflow_call): Main CI runs this exact suite on master pushes
# via main.yml, so PR and master validation cannot drift apart.
# Commands mirror the local nix equivalents in README.md — keep them in sync
# when adding checks.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A new push to the same PR supersedes its older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # RUSTUP_TOOLCHAIN beats rust-toolchain.toml, so CI's pin is explicit and
  # cannot be silently changed by editing the file.
  RUSTUP_TOOLCHAIN: "1.95"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # conformance is a standalone crate (excluded from the workspace, own
  # Cargo.lock) — build it here so it cannot rot behind the workspace checks.
  # The oracle verification against the C++ td repo runs in main.yml.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - run: cargo build --locked --manifest-path conformance/Cargo.toml

  # The standalone lockfiles get no --locked enforcement anywhere else:
  # the conformance build uses it, but fuzz-smoke's cargo-fuzz resolves
  # without --locked and bench has no build at all — so a manifest change
  # that skips their lockfiles went unnoticed (exactly how they drifted
  # before #163). Resolve each standalone graph with --locked so stale
  # locks fail fast (resolution only, no compile).
  standalone-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - run: |
          for m in conformance fuzz bench; do
            cargo metadata --locked --manifest-path "$m/Cargo.toml" --format-version 1 > /dev/null
            echo "$m: lockfile ok"
          done

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The action prepends its default `check` subcommand; passing it here
          # makes cargo-deny parse `check` as a WHICH check-name and fail.
          arguments: --workspace --all-features
      # The standalone crates keep their own lockfiles outside the workspace
      # graph (AGENTS.md) — audit each against the same deny.toml so an
      # advisory cannot hide in a lock no gate reads (#163). These steps
      # keep the action's default `arguments: --all-features` (only the
      # workspace step above needs `--workspace` on top). cargo-deny
      # resolves via cargo metadata, so this gates the committed pins'
      # advisory posture; pure lock staleness trips the standalone-locks
      # --locked resolve instead.
      # Known noise: the shared RUSTSEC-2026-0386 ignore logs an
      # advisory-not-detected warning on the fuzz graph — warn-only, tokio
      # is transitive-only there and unsound advisories are matched for
      # direct dependencies of workspace roots.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: conformance/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: bench/Cargo.toml
